name: Build Gemini Android preview
on:
  push:
    branches: [codex/gemini-live-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - name: Remove stale tracked build outputs
        # Use the verified Gradle distribution below, never the repository's obsolete wrapper JAR.
        run: rm -rf .gradle build app/build gradle/wrapper/gradle-wrapper.jar local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure public app connection
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          values = {
              'SUPABASE_URL': os.environ.get('SUPABASE_URL') or 'https://zezhsmgtdzlagqwlvjui.supabase.co',
              'SUPABASE_ANON_KEY': os.environ.get('SUPABASE_ANON_KEY') or 'YOUR_PUBLISHABLE_KEY',
              'MAPS_API_KEY': os.environ.get('MAPS_API_KEY') or 'YOUR_API_KEY_HERE',
              'WEB_APP_URL': 'https://barn-scan.vercel.app',
          }
          Path('local.properties').write_text(''.join(f'{k}={v}\n' for k, v in values.items()))
          PY
      - name: Unit tests and installable preview
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: app/build/reports/tests/
      - name: Prepare download
        run: cp app/build/outputs/apk/debug/app-debug.apk BARN-Gemini-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BARN-Gemini-Preview
          path: BARN-Gemini-Preview.apk
      - name: Publish preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="gemini-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" BARN-Gemini-Preview.apk --target "$GITHUB_SHA" --prerelease --title "BARN Gemini Preview ${GITHUB_RUN_NUMBER}" --notes "Android preview with typed research and live voice. Installs beside production BARN; sign in again. Requires the property-assistant backend from nsanford510/barn PR 66. If this build has no Supabase publishable key, enter it on the setup screen. Map tiles need the existing Maps build key. Debug-signed preview; not a production replacement."
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Assistant UI and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.vpt.scout.AssistantScreenTest
            adb pull /sdcard/Android/data/com.vpt.scout.geminipreview/files/assistant-screen.png assistant-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-ui-check
          path: |
            assistant-screen.png
            app/build/reports/androidTests/
